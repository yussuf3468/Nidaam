<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>Nidaam Solutions — Building the future of software</title>
    <meta
      name="description"
      content="Nidaam Solutions builds custom software, web and mobile applications, AI solutions and business automation systems for businesses in Nairobi, Kenya and beyond. Our platform and services are coming soon."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f6f5f3" />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the saved theme before first paint (light by default). -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0a0a');
        }
      } catch (e) {}
    </script>
    <!-- Domain, email and social URLs here mirror src/config/site.ts — keep both in sync -->
    <link rel="canonical" href="https://nidaam.co.ke/" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nidaam Solutions" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://nidaam.co.ke/" />
    <meta property="og:title" content="Nidaam Solutions — Building the future of software" />
    <meta
      property="og:description"
      content="Custom software, web and mobile applications, AI and business automation. Coming soon."
    />
    <meta property="og:image" content="https://nidaam.co.ke/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nidaam Solutions — Building the future of software." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nidaam Solutions — Building the future of software" />
    <meta
      name="twitter:description"
      content="Custom software, web and mobile applications, AI and business automation. Coming soon."
    />
    <meta name="twitter:image" content="https://nidaam.co.ke/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Nidaam Solutions",
        "legalName": "Nidaam Solutions",
        "url": "https://nidaam.co.ke",
        "logo": "https://nidaam.co.ke/apple-touch-icon.png",
        "email": "info@nidaam.co.ke",
        "telephone": "+254722261776",
        "foundingDate": "2026-10-25",
        "description": "Nidaam Solutions builds custom software, web applications, mobile apps, AI solutions and business automation systems.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Hodo Souk, Captain Mungai Street, Eastleigh",
          "addressLocality": "Nairobi",
          "addressCountry": "KE"
        },
        "sameAs": [
          "https://www.tiktok.com/@nidaamsoftware",
          "https://www.instagram.com/nidaamsoftware"
        ]
      }
    </script>

    <!-- Fonts: Manrope (UI and headings) + Outfit (paragraphs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500&display=swap"
    />
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif; color: #171717">
        Nidaam Solutions — Building the future of software. Our platform and services are coming soon.
        Contact us at <a href="mailto:info@nidaam.co.ke" style="color: inherit">info@nidaam.co.ke</a>.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
